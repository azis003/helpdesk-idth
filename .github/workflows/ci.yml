name: SIHATI CI

on:
  push:
    branches: [development, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sihati_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sihati_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_URL: http://127.0.0.1
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: sihati_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: 127.0.0.1
      SESSION_DRIVER: array
      FILESYSTEM_DISK: local
      ATTACHMENT_PRIVATE_DISK: local
      OPS_REQUIRE_SCHEDULER_HEARTBEAT: false
      OPS_REQUIRE_BACKUP_STATUS: false
      OPS_REQUIRE_STORAGE_CHECK: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, intl, pcntl, pdo_pgsql, redis
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --seed --force

      - name: Run formatting check
        run: vendor/bin/pint --test

      - name: Run feature and unit tests
        run: |
          mkdir -p storage/app/private/evidence/ci
          vendor/bin/phpunit --log-junit=storage/app/private/evidence/ci/phpunit.xml

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Verify production caches and readiness command
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan sihati:ops:health --json

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sihati-verification-${{ github.sha }}
          path: storage/app/private/evidence/ci/
          if-no-files-found: warn
          retention-days: 14
